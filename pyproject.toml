[project]
name = "hexapod"
version = "0.1.0"
description = "A clean, extensible hexapod controller for Freenove Big Hexapod with Pololu Maestro"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Sebi" },
]
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.9",
    "numpy>=2.4.6",
    "readchar>=4.2.2",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "smbus2>=0.6.1",
]

[project.scripts]
hexapod = "hexapod.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexapod"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # naming
    "RUF",      # ruff-specific
    "SIM",      # simplify
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[[tool.mypy.overrides]]
module = ["lgpio", "rpi_ws281x"]
ignore_missing_imports = true
